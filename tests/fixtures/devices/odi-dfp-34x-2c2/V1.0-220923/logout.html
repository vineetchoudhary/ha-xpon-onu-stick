<SCRIPT>
function confirmlogout()
{
   if ( !confirm('do you confirm to logout?') ) {
 return false;
  }
  else
 return true;
}
</SCRIPT>
</head>

<blockquote>
<h2><font color="#0000FF">Logout</font></h2>


<form action=/boaform/admin/formLogout method=POST name="cmlogout">

  <tr><td><font size=2>
    This page is used to logout from the Device.
  </font></td></tr>
  <tr><td><hr size=1 noshade align=top></td></tr>
</table>
  <br>
      <input type="submit" value="Logout" name="save" onclick="return confirmlogout()">&nbsp;&nbsp;

 </form>
